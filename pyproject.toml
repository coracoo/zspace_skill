[project]
name = "zspace-mcp"
version = "0.1.0"
description = "ZSpace NAS MCP — 89 tools + 6 skills for Claude Code / Cursor"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "cryptography>=44",
    "fastapi>=0.138",
    "uvicorn>=0.34",
    "fastembed>=0.8",
    "sqlite-vec>=0.1",
    "onnxruntime>=1.27",
    "pydantic>=2.10",
]

[project.scripts]
zspace-mcp = "mcp_server.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nas*", "mcp_server*", "app*", "rag*"]
