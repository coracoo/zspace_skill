[project]
name = "zspace-mcp"
version = "0.1.0"
description = "ZSpace NAS MCP — 89 tools for Claude Code / Cursor"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "cryptography>=44",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.138", "uvicorn>=0.34", "pydantic>=2.10"]
rag = ["fastembed>=0.8", "sqlite-vec>=0.1", "onnxruntime>=1.27"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zspace/nas*", "zspace/mcp_server*"]
