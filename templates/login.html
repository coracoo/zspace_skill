<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ZSpace NAS MCP PoC · 登录</title>
<style>
  body { font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f5f7; margin: 0; padding: 40px 16px; }
  .card { max-width: 380px; margin: 40px auto; background: #fff; padding: 28px 32px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p.sub { margin: 0 0 22px; color: #888; font-size: 12px; }
  label { display: block; font-size: 12px; color: #555; margin: 12px 0 4px; }
  input[type=text], input[type=password] { width: 100%; padding: 9px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
  input:focus { outline: none; border-color: #4f8df7; }
  button { width: 100%; margin-top: 18px; padding: 10px; background: #4f8df7; color: #fff; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #3b7be0; }
  .error { background: #fff4f4; border: 1px solid #ffd6d6; color: #c0392b; padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; font-size: 12px; word-break: break-all; }
  details { margin-top: 12px; font-size: 11px; color: #888; }
  pre { background: #f7f7f9; padding: 8px; border-radius: 4px; overflow-x: auto; font-size: 11px; }
</style>
</head>
<body>
<div class="card">
  <h1>ZSpace NAS · 方案 B 验证</h1>
  <p class="sub">用 NAS 账号登录,验证本地代理能拿到数据</p>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <label for="username">用户名(手机号)</label>
    <input id="username" name="username" type="text" required autofocus>

    <label for="password">密码</label>
    <input id="password" name="password" type="password" required placeholder="≥ 8 位">

    <button type="submit">登录</button>
  </form>

  {% if raw_response %}
  <details>
    <summary>NAS 原始返回(调试用)</summary>
    <pre>{{ raw_response | tojson(indent=2) }}</pre>
  </details>
  {% endif %}
</div>
</body>
</html>
