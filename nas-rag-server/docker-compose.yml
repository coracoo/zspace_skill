services:
  nas-rag:
    image: coracoo/cherry:nas_rag
    container_name: nas-rag
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./fastembed-cache:/root/.cache/fastembed
      - /tmp/zfsv3/sata14/<your_user_id>/data/课程资料/课本:/nas_data:ro
    environment:
      - RAG_DB_PATH=/app/data/rag.db
      - FASTEMBED_CACHE_DIR=/root/.cache/fastembed
      - HF_HUB_OFFLINE=1
      - RAG_SCAN_ROOTS=/nas_data/
      - RAG_WHITELIST_EXTS=.py,.pdf,.md,.txt,.json,.yaml,.yml,.conf,.csv,.log,.mdx,.rst,.tex,.html,.htm,.xml,.ini,.toml,.cfg
      - RAG_MAX_FILE_SIZE_KB=102400
      - RAG_CHUNK_SIZE=500
      - RAG_CHUNK_OVERLAP=50
      - RAG_SLEEP_BETWEEN_PAGES=100
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
